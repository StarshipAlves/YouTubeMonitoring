<!DOCTYPE html>
<html lang="en">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Empire">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#000000">
<title>Starship Alves Empire — Mobile</title>
<style>
:root{--accent-purple:#a27ccc;--accent-blue:#89cff0;--accent-gray:#696969;--positive:#00ff00;--negative:#ff5555;--grid-cols:1}
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#000;color:#e0e0e0;margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);min-height:100vh;display:flex;flex-direction:column;align-items:center}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at bottom,#0b001f 0%,#000 100%);z-index:-3}
.container{width:100%;max-width:430px;padding:12px 10px 24px}
.top-banner-container{width:100%;height:auto;margin-bottom:14px}
.banner-gallery-cell{height:64px;overflow:hidden;display:flex;align-items:center;-webkit-mask-image:linear-gradient(to right,transparent 0%,black 8%,black 92%,transparent 100%);mask-image:linear-gradient(to right,transparent 0%,black 8%,black 92%,transparent 100%)}
.gallery-track{display:flex;gap:16px;width:max-content;animation:marquee 35s linear infinite}
.gallery-item{width:56px;height:56px;border-radius:50%;border:3px solid #30363d;object-fit:cover;flex-shrink:0}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.dashboard-wrapper{display:flex;flex-direction:column;gap:14px;width:100%}
.grid{display:grid;grid-template-columns:repeat(var(--grid-cols,1),1fr);gap:12px;width:100%;order:1}
.channel{position:relative;border-radius:16px;padding:12px;background:rgba(22,27,34,.9);border:1px solid #30363d;min-height:132px;display:flex;align-items:center;justify-content:space-between;gap:10px;overflow:hidden}
.channel.dormant{filter:grayscale(100%) brightness(.8);opacity:.65}
.channel-content{position:relative;z-index:3;display:flex;align-items:center;gap:12px;width:100%}
.logo{width:72px;height:72px;border-radius:50%;border:3px solid #30363d;flex-shrink:0}
.logo.monetized-true{border-color:#2ecc71;box-shadow:0 0 20px 6px rgba(46,204,113,.55)}
.logo.monetized-working{border-color:#a27ccc;box-shadow:0 0 20px 6px rgba(162,124,204,.55)}
.stats-group{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.stats,.change-row{font-size:1.05rem;font-weight:bold;display:flex;align-items:center;gap:6px;text-shadow:0 2px 4px rgba(0,0,0,.9)}
.change-row{font-size:.95rem;padding-top:4px;border-top:1px solid rgba(255,255,255,.15)}
.subs span{color:var(--accent-purple)}.views span{color:var(--accent-blue)}.videos span{color:var(--accent-gray)}
.change-positive{color:var(--positive)}.change-negative{color:var(--negative)}
.days-right-container{position:relative;z-index:3;flex-shrink:0}
.days-number-large{font-size:2rem;font-weight:900;line-height:1;text-shadow:0 4px 10px rgba(0,0,0,.95)}
.latest-thumb-bg{position:absolute;top:0;right:0;bottom:0;height:100%;width:58%;z-index:1;object-fit:cover;pointer-events:none;-webkit-mask-image:linear-gradient(to right,transparent 0%,black 35%,black 65%,transparent 100%);mask-image:linear-gradient(to right,transparent 0%,black 35%,black 65%,transparent 100%)}
.live-badge{position:absolute;left:70%;top:50%;transform:translate(-50%,-50%) scale(1.35);z-index:6;background:#cc0000;color:#fff;font-weight:800;padding:6px 10px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;pointer-events:none}
.live-badge-label{font-size:.95rem}.live-badge-viewers{font-size:.72rem}
.totals-cell{background:rgba(22,27,34,.9);border:2px solid var(--accent-purple);border-radius:16px;padding:16px 0 10px;display:flex;align-items:center;position:relative;order:2;overflow:hidden}
.totals-main-content{flex:1;display:flex;flex-direction:column;gap:10px;padding-left:42px;padding-right:8px}
.totals-stats-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-around;align-items:center}
.totals-item{text-align:center;min-width:90px}.totals-item strong{display:block;font-size:.75rem}.totals-item span{font-size:1.25rem;font-weight:bold}
.empire-chart-container{width:100%;height:48px;border-top:1px solid rgba(255,255,255,.1);padding-top:8px;text-align:center}
.empire-chart-label{font-size:.7rem;color:#8b949e;text-transform:uppercase;letter-spacing:1px}
.empire-svg{width:100%;height:32px}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(162,124,204,.2);border:1px solid var(--accent-purple);color:#fff;font-size:1.3rem;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:5}
.arrow-left{left:8px}.nav-arrow.hidden{display:none}
.settings-panel{width:48px;align-self:stretch;background:rgba(162,124,204,.1);border-left:1px solid rgba(162,124,204,.3);display:flex;align-items:center;justify-content:center;margin-top:-16px;margin-bottom:-10px}
.settings-panel svg{width:22px;height:22px;fill:#8b949e}
.settings-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
.settings-modal.active{display:flex}
.settings-content{background:rgba(22,27,34,.95);border:2px solid var(--accent-purple);border-radius:16px;padding:24px;width:min(320px,calc(100vw - 32px));display:flex;flex-direction:column;gap:16px}
.setting-field{display:flex;flex-direction:column;gap:8px}
.setting-field input{background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#fff;padding:10px;font-size:1.2rem;text-align:center}
.setting-buttons{display:flex;gap:10px}.setting-buttons button{flex:1;padding:10px;border-radius:8px;font-weight:bold;border:none}
.btn-save{background:var(--accent-purple);color:#fff}.btn-cancel{background:#30363d;color:#fff}
.page-indicator{text-align:center;color:#8b949e;font-size:.9rem;order:3}
</style>
</head>
<body>
<div class="container">
<div class="top-banner-container"><div class="banner-gallery-cell"><div class="gallery-track" id="gallery-track"></div></div></div>
<div class="dashboard-wrapper" id="dashboard-wrapper"><p style="text-align:center;color:#8b949e;padding:80px 0">Refreshing empire... 🚀</p></div>
</div>
<div class="settings-modal" id="settings-modal"><div class="settings-content"><h3>Grid Settings</h3><div class="setting-field"><label for="input-cols">Columns</label><input type="number" id="input-cols" min="1" max="6" value="1"></div><div class="setting-field"><label for="input-rows">Rows</label><input type="number" id="input-rows" min="1" max="20" value="16"></div><div class="setting-buttons"><button class="btn-cancel" onclick="closeSettings()">Cancel</button><button class="btn-save" onclick="saveSettings()">Save</button></div></div></div>
<script>
const API_KEY='AIzaSyDET4iBC-7E6gkaorsNVolegXp83x4BHl4';
const STORAGE_KEY='starshipEmpireLastSubs';
const SETTINGS_KEY='starshipEmpireGridSettingsMobile';
const HISTORY_KEY='starshipEmpireHistoryData';
const channels=[{id:'UCU6_M2wW_6BeTGuXGO-jx-Q',name:'Starship Alves',monetized:'Working'},{id:'UCj4A0UFnbjjJkbckANoNSaQ',name:'Starship Alves Universe',monetized:'Working'},{id:'UCwYDv3oodWbw163-TW4Wqdg',name:'Artwork Loops',monetized:'True'},{id:'UCCL3BJbM0B8QsaF2jQ0aOEw',name:'Holiday Background TV',monetized:'True'},{id:'UCPj152rMYGKWPaCLyPiu8Kw',name:'Bedtime Story Machine',monetized:'Working'},{id:'UC6ddlUYHzR3CIIHJjB_gnzg',name:'Fantasy Story Machine',monetized:'Working'},{id:'UCXq02MpugL8VZOfUmF2hoUw',name:'Short Story Machine',monetized:'True'},{id:'UCpDuRxkEs_A5y7F8thU9AUA',name:'Chill To Nature',monetized:'Working'},{id:'UCU-RLBZxaKCamvu2XBnUSmQ',name:'Theatre Of The Mind The Game',monetized:'Dormant'},{id:'UCC1_42NiJKm5AzalSEEQwsw',name:'Radio Story Machine',monetized:'Dormant'},{id:'UCmH91Ij_kV5P56tmHJ4IO9A',name:'Starship Chill',monetized:'Working'},{id:'UCxlg3uLx0AVSssLyKTfa86w',name:'Sleepy Story Machine',monetized:'Dormant'},{id:'UCfCMuw1icZk46dtAQGKQrHQ',name:'Starship Comedy',monetized:'Working'},{id:'UCHHMY3OaPqCjNh9DHzv_7rA',name:'Projector Backgrounds',monetized:'Dormant'},{id:'UC6CkisE3r4vGfJiYqahj1Kw',name:'Hardcore Dreamcore',monetized:'Dormant'},{id:'UCpgKc5XBI4R9gaBxfZmZyFA',name:'Strange Dream Machine',monetized:'Dormant'}];
let currentPage=0,globalChannelData=[],globalTotalsObj=null;
function getSettings(){const s=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null');return (s&&s.cols&&s.rows)?s:{cols:1,rows:16}}
function openSettings(){const s=getSettings();document.getElementById('input-cols').value=s.cols;document.getElementById('input-rows').value=s.rows;document.getElementById('settings-modal').classList.add('active')}
function closeSettings(){document.getElementById('settings-modal').classList.remove('active')}
function saveSettings(){const cols=parseInt(document.getElementById('input-cols').value)||1;const rows=parseInt(document.getElementById('input-rows').value)||16;localStorage.setItem(SETTINGS_KEY,JSON.stringify({cols,rows}));closeSettings();if(globalChannelData.length){currentPage=0;renderDashboard(globalChannelData,globalTotalsObj)}}
function renderGallery(channelData){const track=document.getElementById('gallery-track');if(!track)return;track.innerHTML='';[...channelData,...channelData].forEach(item=>{const img=document.createElement('img');img.className='gallery-item';img.src=item.logo;img.alt=item.name;track.appendChild(img)})}
function recordHistorySnapshot(channelData,totalSubs){let history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');const today=new Date().toISOString().split('T')[0];const i=history.findIndex(h=>h.date===today);const snap={date:today,totalSubs};if(i>=0)history[i]=snap;else history.push(snap);if(history.length>30)history=history.slice(-30);localStorage.setItem(HISTORY_KEY,JSON.stringify(history));return history}
function generateEmpireChart(history){if(!history||history.length<2)return '<p style="font-size:.8rem;color:#696969">Building daily snapshot history...</p>';const pts=history.map(h=>h.totalSubs);const min=Math.min(...pts),max=Math.max(...pts),range=(max-min)||1,w=600,h=35,step=w/(pts.length-1);const points=pts.map((v,i)=>`${i*step},${h-((v-min)/range)*(h-10)-5}`).join(' ');return `<svg class="empire-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="#a27ccc" stroke-width="3" points="${points}"/></svg>`}
function fetchWithTimeout(url,ms=8000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t))}
function isVideoCurrentlyLive(video){if(!video)return false;if(video.snippet&&video.snippet.liveBroadcastContent==='live')return true;const ls=video.liveStreamingDetails;return !!(ls&&ls.actualStartTime&&!ls.actualEndTime)}
function livePlaylistId(id){return (id&&id.startsWith('UC'))?('UULV'+id.slice(2)):''}
async function fetchLiveStatusByVideoIds(ids){const liveMap={};const unique=[...new Set(ids.filter(Boolean))];for(let i=0;i<unique.length;i+=50){const batch=unique.slice(i,i+50);try{const r=await fetchWithTimeout(`https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails,snippet&id=${batch.join(',')}&key=${API_KEY}`,8000);if(!r.ok)continue;const d=await r.json();(d.items||[]).forEach(v=>{const raw=v.liveStreamingDetails&&v.liveStreamingDetails.concurrentViewers;const n=raw!=null&&raw!==''?parseInt(raw,10):null;liveMap[v.id]={live:isVideoCurrentlyLive(v),viewers:Number.isFinite(n)?n:null}})}catch(e){}}return liveMap}
async function fetchLiveFlagsByChannel(channelData){const flags={};const map={};const all=[];await Promise.all(channelData.map(async ch=>{flags[ch.id]={live:false,viewers:null};map[ch.id]=[];const pl=livePlaylistId(ch.id);if(!pl)return;try{const r=await fetchWithTimeout(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=5&playlistId=${pl}&key=${API_KEY}`,8000);if(!r.ok)return;const d=await r.json();(d.items||[]).forEach(it=>{const vid=it.snippet&&it.snippet.resourceId&&it.snippet.resourceId.videoId;if(vid){map[ch.id].push(vid);all.push(vid)}})}catch(e){}}));const liveMap=await fetchLiveStatusByVideoIds(all);channelData.forEach(ch=>{let live=false,viewers=0,has=false;(map[ch.id]||[]).forEach(id=>{const info=liveMap[id];if(!info||!info.live)return;live=true;if(info.viewers!=null){viewers+=info.viewers;has=true}});flags[ch.id]={live,viewers:live&&has?viewers:null}});return flags}
async function fetchData(){const wrapper=document.getElementById('dashboard-wrapper');wrapper.innerHTML='<p style="text-align:center;color:#8b949e;padding:80px 0">Refreshing empire... 🚀</p>';try{const ids=channels.map(c=>c.id).join(',');const chRes=await fetchWithTimeout(`https://www.googleapis.com/youtube/v3/channels?part=statistics,snippet,contentDetails&id=${ids}&key=${API_KEY}`,12000);if(!chRes.ok)throw new Error('API error: '+chRes.status);const chData=await chRes.json();let channelData=[];if(chData.items){channelData=chData.items.map(item=>{const stats=item.statistics||{};const thumbs=(item.snippet&&item.snippet.thumbnails)||{};const logo=(thumbs.medium&&thumbs.medium.url)||(thumbs.default&&thumbs.default.url)||'';const meta=channels.find(c=>c.id===item.id)||{};const related=(item.contentDetails&&item.contentDetails.relatedPlaylists)||{};return{id:item.id,uploadsId:related.uploads||'',subs:parseInt(stats.subscriberCount||0),views:parseInt(stats.viewCount||0),videos:parseInt(stats.videoCount||0),logo,name:meta.name||'Unknown',monetized:meta.monetized||'False',daysSinceVideo:'—',daysVideoColor:'#ff5555',latestThumb:'',isLive:false,liveViewers:null}})}
channelData.sort((a,b)=>b.subs-a.subs);const totalSubs=channelData.reduce((s,c)=>s+c.subs,0);const totalViews=channelData.reduce((s,c)=>s+c.views,0);const totalVideos=channelData.reduce((s,c)=>s+c.videos,0);const history=recordHistorySnapshot(channelData,totalSubs);const previous=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');const prevMap=previous.perChannel||{};channelData.forEach(ch=>ch.subChange=ch.subs-(prevMap[ch.id]||0));const totalChange=totalSubs-(previous.total||0);const cur={};channelData.forEach(ch=>cur[ch.id]=ch.subs);localStorage.setItem(STORAGE_KEY,JSON.stringify({total:totalSubs,perChannel:cur,timestamp:Date.now()}));globalChannelData=channelData;globalTotalsObj={subs:totalSubs,views:totalViews,videos:totalVideos,subChange:totalChange,history};renderGallery(channelData);renderDashboard(channelData,globalTotalsObj);await Promise.all(channelData.map(async ch=>{if(!ch.uploadsId)return;try{const r=await fetchWithTimeout(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=1&playlistId=${ch.uploadsId}&key=${API_KEY}`,10000);if(!r.ok)return;const d=await r.json();if(!d.items||!d.items.length)return;const sn=d.items[0].snippet;const diffDays=Math.floor((Date.now()-new Date(sn.publishedAt))/(1000*60*60*24));ch.daysSinceVideo=diffDays>=0?diffDays:'—';ch.daysVideoColor=diffDays<=6?'#00ff00':diffDays<=10?'#ffff00':'#ff5555';const th=sn.thumbnails||{};ch.latestThumb=(th.high&&th.high.url)||(th.medium&&th.medium.url)||(th.default&&th.default.url)||''}catch(e){}}));renderDashboard(channelData,globalTotalsObj);try{const flags=await fetchLiveFlagsByChannel(channelData);let changed=false;channelData.forEach(ch=>{const info=flags[ch.id]||{live:false,viewers:null};if(ch.isLive!==info.live||ch.liveViewers!==info.viewers)changed=true;ch.isLive=info.live;ch.liveViewers=info.viewers});if(changed)renderDashboard(channelData,globalTotalsObj)}catch(e){}}catch(err){wrapper.innerHTML=`<p style="text-align:center;color:#ff5555;padding:80px 0">Refresh failed<br><small>${err.message}</small></p>`}}
function getChangeDisplay(change){if(!change)return null;return change>0?{text:'+'+change.toLocaleString(),class:'change-positive'}:{text:change.toLocaleString(),class:'change-negative'}}
function renderDashboard(channelData,totalsObj){const settings=getSettings();const cols=settings.cols,rows=settings.rows;document.documentElement.style.setProperty('--grid-cols',cols);const per=cols*rows;const pages=[];for(let i=0;i<channelData.length;i+=per)pages.push(channelData.slice(i,i+per));if(!pages.length)pages.push([]);if(currentPage>=pages.length)currentPage=pages.length-1;if(currentPage<0)currentPage=0;const curr=pages[currentPage];const wrapper=document.getElementById('dashboard-wrapper');wrapper.innerHTML='';if(curr.length){const grid=document.createElement('div');grid.className='grid';curr.forEach(item=>{const chg=getChangeDisplay(item.subChange);let glow='',dorm='';if(item.monetized==='True')glow='monetized-true';else if(item.monetized==='Working')glow='monetized-working';else if(item.monetized==='Dormant')dorm='dormant';const viewers=item.liveViewers!=null?`<span class="live-badge-viewers">${Number(item.liveViewers).toLocaleString()}</span>`:'';const live=item.isLive?`<div class="live-badge"><span class="live-badge-label">LIVE</span>${viewers}</div>`:'';const div=document.createElement('div');div.className='channel '+dorm;div.innerHTML=`<div class="channel-content"><img class="logo ${glow}" src="${item.logo}" alt="${item.name}"><div class="stats-group"><div class="stats subs"><span>👤</span> <span>${item.subs.toLocaleString()}</span></div><div class="stats views"><span>👁</span> <span>${item.views.toLocaleString()}</span></div><div class="stats videos"><span>🎬</span> <span>${item.videos.toLocaleString()}</span></div>${chg?`<div class="change-row ${chg.class}"><span>Δ Subs</span> <span>${chg.text}</span></div>`:''}</div></div>${item.latestThumb?`<img class="latest-thumb-bg" src="${item.latestThumb}" referrerpolicy="no-referrer">`:''}<div class="days-right-container"><div class="days-number-large" style="color:${item.daysVideoColor}">${item.daysSinceVideo}</div></div>${live}`;div.onclick=()=>fetchData();grid.appendChild(div)});wrapper.appendChild(grid)}
const change=getChangeDisplay(totalsObj.subChange);const totals=document.createElement('div');totals.className='totals-cell';const left=document.createElement('div');left.className='nav-arrow arrow-left'+(pages.length<=1?' hidden':'');left.innerHTML='&#10094;';left.onclick=e=>{e.stopPropagation();currentPage=(currentPage-1+pages.length)%pages.length;renderDashboard(globalChannelData,globalTotalsObj)};const right=document.createElement('div');right.className='nav-arrow arrow-right'+(pages.length<=1?' hidden':'');right.style.right='56px';right.innerHTML='&#10095;';right.onclick=e=>{e.stopPropagation();currentPage=(currentPage+1)%pages.length;renderDashboard(globalChannelData,globalTotalsObj)};const gear=document.createElement('div');gear.className='settings-panel';gear.innerHTML='<svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>';gear.onclick=e=>{e.stopPropagation();openSettings()};totals.innerHTML=`<div class="totals-main-content"><div class="totals-stats-row"><div class="totals-item"><strong>Total Subs</strong><span style="color:var(--accent-purple)">${totalsObj.subs.toLocaleString()}</span></div><div class="totals-item"><strong>Total Views</strong><span style="color:var(--accent-blue)">${totalsObj.views.toLocaleString()}</span></div><div class="totals-item"><strong>Total Videos</strong><span style="color:var(--accent-gray)">${totalsObj.videos.toLocaleString()}</span></div>${change?`<div class="totals-item"><strong>Δ Subs</strong><span class="${change.class}">${change.text}</span></div>`:''}</div><div class="empire-chart-container"><div class="empire-chart-label">Empire Growth Trend</div>${generateEmpireChart(totalsObj.history)}</div></div>`;totals.prepend(left);totals.appendChild(right);totals.appendChild(gear);totals.onclick=e=>{if(!e.target.closest('.settings-panel')&&!e.target.closest('.nav-arrow'))fetchData()};wrapper.appendChild(totals);if(pages.length>1){const ind=document.createElement('div');ind.className='page-indicator';ind.innerText=`Page ${currentPage+1} of ${pages.length}`;wrapper.appendChild(ind)}}
window.onload=()=>fetchData();
</script>
</body>
</html>
